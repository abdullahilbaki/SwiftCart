<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftCart | Products</title>
    <link
      rel="shortcut icon"
      href="./assets/shopping-cart.png"
      type="image/x-icon"
    />

    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Figtree font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Css -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Tailwind & DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <!-- Main body -->
  <body class="font-medium">
    <div id="navbar"></div>
    <div id="products"></div>
    <div id="footer"></div>

    <!-- modal -->
    <dialog
      id="product_details_modal"
      class="modal modal-bottom sm:modal-middle"
    >
      <div class="modal-box max-w-4xl p-0 overflow-hidden relative">
        <form method="dialog">
          <button
            class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 z-50 bg-white/50 backdrop-blur-sm"
          >
            ✕
          </button>
        </form>
        <div id="modal-content"></div>
      </div>
      <form
        method="dialog"
        class="modal-backdrop bg-slate-900/60 backdrop-blur-sm"
      >
        <button>close</button>
      </form>
    </dialog>
  </body>

  <!-- JavaScript files -->
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/showProducts.js"></script>
  <script type="module" src="js/footer.js"></script>
</html>
